<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Tripcerto social card — preview</title>
    <!--
      One rendered card, shown the three ways it will actually be seen: full
      size, as an iMessage rich link, and as an X summary_large_image card.
      A card that reads at 1200x630 can still fail at 300px wide in a bubble,
      and that is the size most people meet it at, so the review sheet shows
      both rather than the artwork alone.

      The chrome here is a reproduction of each client's, not a screenshot of
      it: measured proportions, their type sizes, their greys.

      ?v=a|b|c|d|e
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #281131;
        --muted: #685A6E;
        --pink: #e8437e;
        --tint: #fff1ea;
        --band: linear-gradient(100deg, #e8437e 0%, #ff5c6c 50%, #ff9b7a 100%);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1160px;
        font-family: 'Instrument Sans', system-ui, sans-serif;
        background: #ffffff;
        color: var(--ink);
        padding: 44px 48px 48px;
        -webkit-font-smoothing: antialiased;
      }

      .sheet-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding-bottom: 18px;
        border-bottom: 2px solid var(--ink);
      }
      .letter {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        color: #fff;
        background: var(--ink);
        border-radius: 7px;
        padding: 5px 11px;
      }
      .title {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .note {
        margin-left: auto;
        font-size: 15px;
        color: var(--muted);
        max-width: 560px;
        text-align: right;
      }

      .label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 30px 0 12px;
      }

      .card-shot {
        width: 100%;
        display: block;
        border-radius: 10px;
        border: 1px solid #e6e0dd;
      }

      .clients {
        display: grid;
        grid-template-columns: 330px 1fr;
        gap: 40px;
        align-items: start;
      }

      /* ---- iMessage ----------------------------------------------------- */
      /* A rich link in a received bubble: the image at the link's own ratio,
         then a caption strip carrying the title and the host. */
      .imessage {
        background: #e9e9eb;
        border-radius: 17px;
        overflow: hidden;
        width: 300px;
      }
      .imessage img {
        width: 100%;
        display: block;
      }
      .imessage .cap {
        padding: 8px 11px 10px;
        background: #e9e9eb;
      }
      .imessage .t {
        font-family: -apple-system, 'SF Pro Text', 'Instrument Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.28;
        color: #000;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .imessage .h {
        font-family: -apple-system, 'SF Pro Text', 'Instrument Sans', sans-serif;
        font-size: 12px;
        color: #8a8a8e;
        margin-top: 2px;
      }
      .phone-bg {
        background: #fff;
        padding: 0;
      }

      /* ---- X ------------------------------------------------------------ */
      .x {
        width: 100%;
        max-width: 520px;
        border: 1px solid #cfd9de;
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
      }
      .x img {
        width: 100%;
        display: block;
        border-bottom: 1px solid #cfd9de;
      }
      .x .cap {
        padding: 12px;
        font-family: -apple-system, 'Segoe UI', 'Instrument Sans', sans-serif;
      }
      .x .h {
        font-size: 15px;
        color: #536471;
        line-height: 1.3;
      }
      .x .t {
        font-size: 15px;
        color: #0f1419;
        margin-top: 2px;
        line-height: 1.3;
      }
      .x .d {
        font-size: 15px;
        color: #536471;
        margin-top: 2px;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .meta {
        margin-top: 30px;
        border-top: 1px solid #ece6e3;
        padding-top: 16px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
      }
      .meta b {
        color: var(--ink);
        font-weight: 600;
      }
      .meta code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12.5px;
        background: var(--tint);
        padding: 1px 5px;
        border-radius: 4px;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <script type="module">
      import { variants } from './copy.js'

      const id = new URLSearchParams(location.search).get('v') ?? 'a'
      const v = variants[id]
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

      /* What each client actually prints beside the picture: the og:title
         and the og:description, not the card's own headline. Both are what
         index.html carries today. */
      const pageTitle = 'Tripcerto'
      const pageDesc =
        'Engage understands what each website visitor wants and passes the full brief to your sales team. Workspace builds an itemised trip from the enquiry as soon as it arrives and shows what is still missing.'

      const src = `out/card-${id}.png`

      document.getElementById('mount').innerHTML = `
        <div class="sheet-head">
          <span class="letter">${id.toUpperCase()}</span>
          <span class="title">${esc(v.name)}</span>
          <span class="note">${esc(v.note)}</span>
        </div>

        <p class="label">The card — 1200 × 630</p>
        <img class="card-shot" src="${src}" alt="" />

        <div class="clients">
          <div>
            <p class="label">iMessage</p>
            <div class="phone-bg">
              <div class="imessage">
                <img src="${src}" alt="" />
                <div class="cap">
                  <div class="t">${esc(pageTitle)}</div>
                  <div class="h">TRIPCERTO.COM</div>
                </div>
              </div>
            </div>
          </div>
          <div>
            <p class="label">X · LinkedIn · Slack</p>
            <div class="x">
              <img src="${src}" alt="" />
              <div class="cap">
                <div class="h">tripcerto.com</div>
                <div class="t">${esc(pageTitle)}</div>
                <div class="d">${esc(pageDesc)}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="meta">
          <p><b>Headline on the card</b> — ${esc(v.head)}</p>
          ${v.sub ? `<p><b>Line under it</b> — ${esc(v.sub)}</p>` : ''}
          ${
            v.columns
              ? `<p><b>Columns</b> — ${v.columns.map((c) => `${esc(c.name)}: ${esc(c.line)}`).join('  ·  ')}</p>`
              : ''
          }
        </div>`

      window.cardReady = Promise.all([
        document.fonts.ready,
        ...[...document.images].map((img) => (img.complete ? null : new Promise((r) => (img.onload = img.onerror = r)))),
      ])
    </script>
  </body>
</html>
