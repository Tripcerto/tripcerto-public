<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff1ea" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1A0B20')
        }
      } catch (e) {}
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=9" sizes="any" />
    <link rel="icon" href="/favicon.ico?v=9" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=9" />
    <link rel="mask-icon" href="/mask-icon.svg?v=9" color="#ff5c6c" />
    <link rel="manifest" href="/site.webmanifest?v=9" />

    <title>Tripcerto | We make complex travel easier to plan and sell</title>
    <meta
      name="description"
      content="Engage understands what each website visitor wants and passes the full brief to your sales team. Workspace builds the quote structure from that brief and shows what is still missing. Your experts decide what goes to the customer."
    />
    <link rel="canonical" href="https://tripcerto.com/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tripcerto" />
    <meta property="og:url" content="https://tripcerto.com/" />
    <meta property="og:title" content="Tripcerto | We make complex travel easier to plan and sell" />
    <meta
      property="og:description"
      content="Engage understands what each website visitor wants and passes the full brief to your sales team. Workspace builds the quote structure from that brief and shows what is still missing."
    />
    <meta property="og:image" content="https://tripcerto.com/og-image.png?v=9" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tripcerto: AI that makes complex travel easier to plan and sell" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tripcerto | We make complex travel easier to plan and sell" />
    <meta
      name="twitter:description"
      content="Engage understands what each website visitor wants and passes the full brief to your sales team. Workspace builds the quote structure from that brief and shows what is still missing."
    />
    <meta name="twitter:image" content="https://tripcerto.com/og-image.png?v=9" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
