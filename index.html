<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff1ea" />
    <script>
      document.documentElement.classList.add('js')
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1A0B20')
        }
      } catch (e) {}
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=10" sizes="any" />
    <link rel="icon" href="/favicon.ico?v=10" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=9" />
    <link rel="mask-icon" href="/mask-icon.svg?v=9" color="#ff5c6c" />
    <link rel="manifest" href="/site.webmanifest?v=9" />

    <title>Tripcerto</title>
    <meta

      content="Engage understands what each website visitor wants and passes the full brief to your sales team. Workspace builds an itemised trip from the enquiry as soon as it arrives and shows what is still missing. Your experts decide what goes to the customer."
